# Déploiement de l'API, conforme au profil Pod Security « restricted ».
# IMAGE_REF est remplacé par la CI par l'image SIGNÉE, référencée par digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-api
  namespace: apps
  labels:
    app.kubernetes.io/name: invoice-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: invoice-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoice-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: IMAGE_REF
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-api
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: invoice-api
  ports:
    - name: http
      port: 80
      targetPort: http
